# Proyek Supabase gratis dijeda bila hampir tak ada aktivitas. Workflow ini "menyentuh" database sekali sehari
# lewat fungsi /ping supaya proyek tetap aktif. Butuh variabel repositori API_URL.
name: Jaga proyek Supabase tetap aktif

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping API
        env:
          API_URL: ${{ vars.API_URL }}
        run: |
          if [ -z "$API_URL" ]; then echo "Variabel API_URL belum diisi."; exit 0; fi
          curl -fsS --max-time 30 "${API_URL%/}/ping"
