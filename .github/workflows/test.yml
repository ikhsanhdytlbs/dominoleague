# Menjalankan seluruh uji otomatis (server Node dan Edge Function) setiap ada perubahan.
name: Uji

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
