# OPSIONAL: men-deploy Edge Function "api" ke Supabase dari GitHub (tanpa terminal di komputer Anda).
# Hanya butuh:  Secret SUPABASE_ACCESS_TOKEN  dan  Variable SUPABASE_PROJECT_REF  (di Settings repositori > Secrets and variables > Actions).
# Dilewati otomatis bila SUPABASE_PROJECT_REF belum diisi. Bisa dijalankan manual (tab Actions > Run workflow).
# Tabel dibuat sekali lewat SQL Editor Supabase (lihat SUPABASE-GITHUB.md Langkah 2), bukan lewat workflow ini.
name: Deploy fungsi ke Supabase (opsional)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'supabase/**'
      - 'engine/**'
      - 'dominoLogic.js'
      - 'demoData.js'

jobs:
  deploy:
    if: ${{ vars.SUPABASE_PROJECT_REF != '' }}
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Pastikan file bersama Edge Function sinkron
        run: node scripts/sync-supabase.mjs --check
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Deploy fungsi api
        run: supabase functions deploy api --remote="$PROJECT_REF" --no-verify-jwt --yes
