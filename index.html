<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Domino League - Klasemen & Statistik Domino</title>
  
  <!-- Favicon Domino Logo (Tab Browser) -->
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="alternate icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect x='14' y='4' width='36' height='56' rx='6' fill='%23FACC15' stroke='%23CA8A04' stroke-width='2'/><line x1='16' y1='32' x2='48' y2='32' stroke='%23DC2626' stroke-width='3'/><circle cx='25' cy='18' r='3.5' fill='%23DC2626'/><circle cx='39' cy='18' r='3.5' fill='%23DC2626'/><circle cx='25' cy='46' r='3.5' fill='%23DC2626'/><circle cx='39' cy='46' r='3.5' fill='%23DC2626'/></svg>">
  <link rel="apple-touch-icon" href="favicon.svg">
  
  <!-- Google Fonts: Plus Jakarta Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'sans-serif'],
          },
          colors: {
            domino: {
              yellow: '#FACC15',       // Kuning khas kartu domino ACBC
              yellowDark: '#EAB308',   // Kuning keemasan
              yellowLight: '#FEF9C3',  // Kuning mentega lembut
              yellowBg: '#FFFBEB',     // Krem kuning sangat lembut
              red: '#DC2626',          // Merah titik balak & garis pembagi domino
              redHover: '#B91C1C',     // Merah tua hover
              redLight: '#FEE2E2',     // Merah pastel muda
              blue: '#0284C7',         // Biru huruf "A" & "B" pada box ACBC
              blueLight: '#E0F2FE',    // Biru pastel muda
              black: '#1C1917',        // Hitam arang kartu
              darkCard: '#18181B',     // Hitam pekat kartu ringkasan
              border: '#EFE8CD',       // Garis batas bernuansa hangat
              bg: '#F6F3E7'            // Latar belakang meja / kanvas hangat
            }
          },
          boxShadow: {
            card: '0 4px 20px -2px rgba(180, 160, 100, 0.08), 0 2px 6px -1px rgba(180, 160, 100, 0.04)',
            pill: '0 4px 14px rgba(220, 38, 38, 0.25)',
            darkPill: '0 4px 14px rgba(28, 25, 23, 0.25)'
          }
        }
      }
    }
  </script>
  <style>
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: #F6F3E7;
      color: #1C1917;
    }
    
    /* Custom Scrollbars in Domino Theme */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: transparent;
    }
    ::-webkit-scrollbar-thumb {
      background: #E5DEBF;
      border-radius: 999px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #D4CA9E;
    }

    @media print {
      body * {
        visibility: hidden;
      }
      #printable-certificate, #printable-certificate * {
        visibility: visible;
      }
      #printable-certificate {
        position: fixed;
        left: 0;
        top: 0;
        width: 100%;
        height: 100%;
        margin: 0;
        padding: 40px !important;
        border: 12px double #DC2626 !important;
        background: #FFFDF0 !important;
        box-shadow: none !important;
      }
      .modal-backdrop {
        background: transparent !important;
      }
    }
  </style>
  <style id="sidebar-styles">
    /* Menu samping: laci geser di layar sempit (HP), bisa disembunyikan di layar lebar */
    .menu-open-btn { display: none; width: 2.5rem; height: 2.5rem; flex-shrink: 0; align-items: center; justify-content: center; border-radius: 9999px; background: #fffbeb; border: 1px solid #fde68a; color: #92400e; cursor: pointer; }
    .menu-open-btn:hover { background: #fef3c7; }
    .sidebar-backdrop { display: none; }
    @media (max-width: 1023px) {
      .menu-open-btn { display: inline-flex; }
      .app-sidebar {
        position: fixed !important; top: 0; bottom: 0; left: 0; z-index: 50;
        width: min(86vw, 320px) !important; max-width: 100%;
        overflow-y: auto; overscroll-behavior: contain;
        border-radius: 0 28px 28px 0 !important;
        transform: translateX(-110%); visibility: hidden;
        transition: transform .25s ease, visibility 0s linear .25s;
      }
      body.menu-open .app-sidebar { transform: translateX(0); visibility: visible; transition: transform .25s ease, visibility 0s; }
      body.menu-open .sidebar-backdrop { display: block; position: fixed; inset: 0; z-index: 40; background: rgba(28, 25, 23, .5); }
      body.menu-open { overflow: hidden; }
    }
    @media (min-width: 1024px) {
      body.menu-collapsed .app-sidebar { display: none !important; }
      body.menu-collapsed .menu-open-btn { display: inline-flex; }
    }
    @media (prefers-reduced-motion: reduce) { .app-sidebar { transition: none !important; } }
  </style>
  <style id="mvp-styles">
    /* Karakter MVP: melompat gembira, lengan melambai, konfeti jatuh */
    .mvp-svg { overflow: visible; }
    .mvp-char, .mvp-shadow, .mvp-arm-l, .mvp-arm-r, .mvp-crown { transform-box: view-box; }
    .mvp-char { transform-origin: 60px 114px; animation: mvp-jump 1.1s ease-in-out infinite; }
    .mvp-shadow { transform-origin: 60px 124px; animation: mvp-shadow 1.1s ease-in-out infinite; }
    .mvp-arm-l { transform-origin: 34px 60px; animation: mvp-wave-l .55s ease-in-out infinite; }
    .mvp-arm-r { transform-origin: 86px 60px; animation: mvp-wave-r .55s ease-in-out infinite; }
    .mvp-crown { transform-origin: 60px 36px; animation: mvp-crown 1.1s ease-in-out infinite; }
    .mvp-star { transform-box: fill-box; transform-origin: center; animation: mvp-twinkle 1.2s ease-in-out infinite; }
    .mvp-star.s2 { animation-delay: .4s; } .mvp-star.s3 { animation-delay: .8s; }
    .mvp-conf { transform-box: fill-box; transform-origin: center; animation: mvp-fall 2.4s linear infinite; }
    .mvp-conf.c2 { animation-duration: 2.9s; animation-delay: .3s; } .mvp-conf.c3 { animation-duration: 2.2s; animation-delay: .9s; }
    .mvp-conf.c4 { animation-duration: 3.1s; animation-delay: .5s; } .mvp-conf.c5 { animation-duration: 2.6s; animation-delay: 1.3s; }
    .mvp-conf.c6 { animation-duration: 2.8s; animation-delay: .1s; } .mvp-conf.c7 { animation-duration: 2.3s; animation-delay: 1.6s; }
    .mvp-conf.c8 { animation-duration: 3s; animation-delay: .7s; }
    .mvp-idle .mvp-char { animation: mvp-breathe 3s ease-in-out infinite; }
    .mvp-zzz { animation: mvp-zzz 2.4s ease-in-out infinite; } .mvp-zzz.z2 { animation-delay: 1.1s; }
    @keyframes mvp-jump { 0%, 100% { transform: translateY(0) scale(1.05, .93); } 12% { transform: translateY(0) scale(1.05, .93); } 50% { transform: translateY(-18px) scale(.96, 1.05); } 88% { transform: translateY(0) scale(1.05, .93); } }
    @keyframes mvp-shadow { 0%, 100% { transform: scale(1); opacity: .9; } 50% { transform: scale(.65); opacity: .5; } }
    @keyframes mvp-wave-l { 0%, 100% { transform: rotate(-10deg); } 50% { transform: rotate(20deg); } }
    @keyframes mvp-wave-r { 0%, 100% { transform: rotate(10deg); } 50% { transform: rotate(-20deg); } }
    @keyframes mvp-crown { 0%, 100% { transform: rotate(-5deg); } 50% { transform: rotate(5deg) translateY(-2px); } }
    @keyframes mvp-twinkle { 0%, 100% { transform: scale(.3); opacity: .2; } 50% { transform: scale(1); opacity: 1; } }
    @keyframes mvp-fall { 0% { transform: translateY(-12px) rotate(0); opacity: 0; } 10% { opacity: 1; } 100% { transform: translateY(140px) rotate(540deg); opacity: .9; } }
    @keyframes mvp-breathe { 0%, 100% { transform: scale(1, 1); } 50% { transform: scale(1.02, .98); } }
    @keyframes mvp-zzz { 0% { transform: translate(0, 0); opacity: 0; } 30% { opacity: 1; } 100% { transform: translate(10px, -16px); opacity: 0; } }
    @media (prefers-reduced-motion: reduce) { .mvp-svg * { animation: none !important; } }
  </style>
</head>
<body class="bg-domino-bg min-h-screen p-2.5 sm:p-5 lg:p-7 flex flex-col justify-between selection:bg-domino-red selection:text-white">

  <!-- MAIN APP CONTAINER -->

        <div class="hidden md:flex items-center gap-3 bg-amber-50 px-5 py-2.5 rounded-2xl border border-amber-200">
          <div>
            <span class="text-[10px] uppercase font-black text-amber-800 block tracking-wider">Pemuncak Domino Champion</span>
            <span id="header-leader-stat" class="text-base font-black text-domino-black">Andi (91.7 pts)</span>
          </div>
          <span class="w-8 h-8 rounded-xl bg-domino-yellow text-amber-950 flex items-center justify-center font-bold text-sm shadow-sm border border-amber-300">👑</span>
        </div>

        <!-- Right Controls: Season Selector, Excel Export & Profile -->
        <div class="flex items-center gap-2.5 sm:gap-3">
          <!-- Season Dropdown Pill -->
          <div class="relative">
            <select id="season-selector" class="bg-amber-50 hover:bg-amber-100 border border-amber-200 text-domino-black text-xs font-bold rounded-2xl px-3.5 py-2.5 pr-8 focus:outline-none focus:ring-2 focus:ring-amber-500/30 cursor-pointer transition">
              <!-- Populated by app.js -->
            </select>
          </div>

          <!-- Notification / Export Button -->
          <button onclick="app.exportToExcel()" title="Unduh Excel / CSV" class="w-10 h-10 rounded-2xl bg-amber-50 hover:bg-amber-100 border border-amber-200 flex items-center justify-center text-amber-900 transition">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path></svg>
          </button>

          <!-- Akun pemain yang sedang login -->
          <button id="account-chip" onclick="app.openAccountModal()" title="Akun" class="flex items-center gap-2.5 pl-2 py-1 pr-3 bg-amber-50 hover:bg-amber-100 border border-amber-200 rounded-2xl transition text-left">
            <div id="account-avatar" class="w-8 h-8 rounded-full bg-domino-red flex items-center justify-center text-white text-xs font-black shadow-sm">?</div>
            <div class="hidden sm:block text-left leading-tight">
              <span id="account-name" class="text-xs font-bold text-domino-black block">Belum masuk</span>
              <span id="account-sub" class="text-[10px] text-amber-700 font-medium block"></span>
            </div>
            <svg class="w-3.5 h-3.5 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg>
          </button>
        </div>
      </header>

      <!-- DYNAMIC VIEWS -->
      <div id="view-dashboard" class="space-y-5"></div>
      <div id="view-input-game" class="hidden"></div>
      <div id="view-players" class="hidden"></div>
      <div id="view-stats" class="hidden"></div>
      <div id="view-h2h" class="hidden"></div>
      <div id="view-awards" class="hidden"></div>
      <div id="view-archive" class="hidden"></div>
      <div id="view-history" class="hidden"></div>
      <div id="view-settings" class="hidden"></div>
    </main>
  </div>

  <!-- MODAL HOST -->
  <div id="login-overlay" class="fixed inset-0 z-[60] bg-white flex items-center justify-center"></div>
  <div id="modal-host"></div>

  <!-- Application Controller -->
  <script src="config.js"></script>
  <script type="module" src="app.js"></script>
</body>
</html>
